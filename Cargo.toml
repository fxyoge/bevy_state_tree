[package]
name = "bevy_state_tree"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Asset-backed hierarchical statecharts for Bevy"
license = "MIT OR Apache-2.0"

[workspace]
members = ["macros", "gigasaver"]
default-members = [".", "macros"]
resolver = "3"

[features]
default = []
persistence = ["dep:serde", "dep:serde_json", "dep:blake3", "bevy_state_tree_macros/persistence"]

[dependencies]
bevy_app = "0.20.0"
bevy_asset = "0.20.0"
bevy_ecs = { version = "0.20.0", features = ["multi_threaded"] }
bevy_reflect = "0.20.0"
bevy_tasks = "0.20.0"
bevy_time = "0.20.0"
bevy_utils = "0.20.0"
bevy_state_tree_macros = { version = "0.1.0", path = "macros" }
bevy_luau = { git = "ssh://git@github.com/fxyoge/bevy_luau.git", rev = "94793a405eaa1d10daeba0a0938f03c52b0b00d9" }
full_moon = { version = "2.2.0", features = ["luau"] }
quick-xml = "0.41"
thiserror = "2.0"
serde = { version = "1", features = ["derive", "rc"], optional = true }
serde_json = { version = "1", optional = true }
blake3 = { version = "1", optional = true }

[dev-dependencies]
bevy_ecs = { version = "0.20.0", features = ["bevy_reflect", "multi_threaded"] }
divan = "0.1.21"

[[bench]]
name = "execution"
harness = false

[[bench]]
name = "allocation"
harness = false

[[bench]]
name = "event_storage"
harness = false

[[bench]]
name = "persistence"
harness = false
required-features = ["persistence"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
