[package]
name = "bevy_state_tree"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Asset-backed hierarchical statecharts for Bevy"
license = "MIT"

[workspace]
members = ["macros"]
default-members = [".", "macros"]
resolver = "3"

[features]
default = []
persistence = ["dep:bevy_gigasaver", "dep:serde", "dep:serde_json", "bevy_luau/serde"]

[dependencies]
bevy_gigasaver = { git = "https://github.com/fxyoge/bevy_gigasaver.git", rev = "58feae59a2994695474524d7aa654da266390f56", optional = true }
bevy_app = "0.20.0"
bevy_asset = "0.20.0"
bevy_ecs = { version = "0.20.0", features = ["multi_threaded"] }
bevy_reflect = "0.20.0"
bevy_tasks = "0.20.0"
bevy_time = "0.20.0"
bevy_utils = "0.20.0"
bevy_state_tree_macros = { version = "0.1.0", path = "macros" }
bevy_luau = { git = "https://github.com/fxyoge/bevy_luau.git", rev = "d4d8b3452165d5858b2c83da41cdbd2a246669bf" }
full_moon = { version = "2.2.0", features = ["luau"] }
quick-xml = "0.41"
thiserror = "2.0"
serde = { version = "1", features = ["derive", "rc"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
bevy_ecs = { version = "0.20.0", features = ["bevy_reflect", "multi_threaded"] }
divan = "0.1.21"

[[example]]
name = "save_slots"
required-features = ["persistence"]

[[bench]]
name = "execution"
harness = false

[[bench]]
name = "allocation"
harness = false

[[bench]]
name = "event_storage"
harness = false

[[bench]]
name = "persistence"
harness = false
required-features = ["persistence"]

[[bench]]
name = "checkpoint_frames"
harness = false
required-features = ["persistence"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
