[package]
name = "bevy_state_tree"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Asset-backed hierarchical statecharts for Bevy"
license = "MIT OR Apache-2.0"

[dependencies]
bevy_app = "0.19.1"
bevy_asset = "0.19.1"
bevy_ecs = { version = "0.19.1", features = ["multi_threaded"] }
bevy_reflect = "0.19.1"
thiserror = "2.0"

[dev-dependencies]
bevy_ecs = { version = "0.19.1", features = ["bevy_reflect", "multi_threaded"] }
bevy_tasks = "0.19.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
