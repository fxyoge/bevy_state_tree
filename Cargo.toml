[package]
name = "bevy_state_tree"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Asset-backed hierarchical statecharts for Bevy"
license = "MIT OR Apache-2.0"

[workspace]
members = ["macros"]
resolver = "3"

[dependencies]
bevy_app = "0.19.1"
bevy_asset = "0.19.1"
bevy_ecs = { version = "0.19.1", features = ["multi_threaded"] }
bevy_reflect = "0.19.1"
bevy_tasks = "0.19.1"
bevy_state_tree_macros = { version = "0.1.0", path = "macros" }
full_moon = { version = "2.2.0", features = ["luau"] }
mlua = { version = "0.11", features = ["luau", "vendored"] }
quick-xml = "0.41"
thiserror = "2.0"

[dev-dependencies]
bevy_ecs = { version = "0.19.1", features = ["bevy_reflect", "multi_threaded"] }
divan = "0.1.21"

[[bench]]
name = "execution"
harness = false

[[bench]]
name = "allocation"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
