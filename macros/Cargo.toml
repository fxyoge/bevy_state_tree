[package]
name = "bevy_state_tree_macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Derive macros for bevy_state_tree"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
proc-macro-crate = "3"
quote = "1"
syn = { version = "3", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
